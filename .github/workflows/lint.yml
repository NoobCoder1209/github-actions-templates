name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: actionlint (reviewdog)
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-pr-review
          fail_level: error
          actionlint_flags: -shellcheck=

  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: ShellCheck (scripts/)
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
          severity: warning
          format: gcc

  yaml-syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: yaml.safe_load all workflow YAMLs
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail=0
          for f in \
            .github/workflows/*.yml \
            .github/actions/setup-tools/action.yml \
            workflow-templates/*.yml \
            examples/*/.github/workflows/*.yml; do
            if ! python3 -c "import yaml,sys; yaml.safe_load(open('$f'))"; then
              echo "Bad YAML: $f"
              fail=1
            fi
          done
          exit "$fail"
