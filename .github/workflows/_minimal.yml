name: minimal-callee
on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
    secrets:
      registry_username:
        required: false
      registry_password:
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "inputs OK image=${{ inputs.image }}"
