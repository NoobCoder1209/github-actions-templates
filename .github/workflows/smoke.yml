# Smoke test: self-call _docker-buildx.yml against fixtures/docker.
# Single-arch, no push, no provenance — purely verifies the reusable
# workflow's wiring on every PR.
name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-buildx-smoke:
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/_docker-buildx.yml
    with:
      image: smoke/hello
      tag: smoke-${{ github.run_id }}
      context: ./fixtures/docker
      dockerfile: Dockerfile
      platforms: linux/amd64
      push: false
      provenance: false
