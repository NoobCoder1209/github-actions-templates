name: smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  call-minimal:
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/_minimal.yml
    with:
      image: smoke/hello
      context: ./fixtures/docker
      dockerfile: Dockerfile
      platforms: linux/amd64
      push: false
      provenance: false
