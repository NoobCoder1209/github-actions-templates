# Smoke test: self-call _docker-buildx.yml against fixtures/docker.
name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  reusable-call:
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/_docker-buildx.yml
    with:
      image: smoke/hello
      context: ./fixtures/docker
      dockerfile: Dockerfile
      platforms: linux/amd64
      push: false
      provenance: false
