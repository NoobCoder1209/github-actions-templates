# Reusable workflow: package a Helm chart and push it to an OCI
# registry (default: GHCR under the repo owner).
#
# Requires Helm 3.8+ which is provided by setup-tools (azure/setup-helm@v5).
# Caller must declare `permissions: { contents: read, packages: write }`.
name: helm-oci-push

on:
  workflow_call:
    inputs:
      chart_dir:
        description: "Directory containing Chart.yaml."
        type: string
        required: false
        default: "./chart"
      registry:
        description: "Target OCI registry URL incl. oci:// scheme."
        type: string
        required: false
        default: "oci://ghcr.io/${{ github.repository_owner }}"
      chart_version:
        description: "Override chart version. Empty leaves Chart.yaml as-is."
        type: string
        required: false
        default: ""
      app_version:
        description: "Override appVersion. Empty leaves Chart.yaml as-is."
        type: string
        required: false
        default: ""
      lint:
        description: "Run helm lint before packaging."
        type: boolean
        required: false
        default: true
      sign:
        description: "Reserved for future cosign signing. Currently a no-op (warns)."
        type: boolean
        required: false
        default: false
    secrets:
      registry_username:
        description: "Override for non-GHCR registry. Defaults to github.actor."
        required: false
      registry_password:
        description: "Override for non-GHCR registry. Defaults to github.token."
        required: false
    outputs:
      chart_name:
        description: "Chart name read from Chart.yaml."
        value: ${{ jobs.push.outputs.chart_name }}
      chart_version:
        description: "Final chart version after override."
        value: ${{ jobs.push.outputs.chart_version }}
      chart_ref:
        description: "Full pushed reference, e.g. ghcr.io/owner/charts/foo:1.2.3."
        value: ${{ jobs.push.outputs.chart_ref }}

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      chart_name: ${{ steps.meta.outputs.chart_name }}
      chart_version: ${{ steps.meta.outputs.chart_version }}
      chart_ref: ${{ steps.publish.outputs.chart_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: ./.github/actions/setup-tools
        with:
          tools: helm

      - name: Read chart metadata
        id: meta
        env:
          CHART_DIR: ${{ inputs.chart_dir }}
          CHART_VERSION_OVERRIDE: ${{ inputs.chart_version }}
        run: |
          set -euo pipefail
          if [ ! -f "$CHART_DIR/Chart.yaml" ]; then
            echo "::error::Chart.yaml not found at $CHART_DIR/Chart.yaml"
            exit 1
          fi
          # Use helm's own parser to handle quoted/escaped values correctly.
          name="$(helm show chart "$CHART_DIR" | awk -F': *' '/^name:/ {print $2; exit}' | tr -d '"' | tr -d "'")"
          version="$(helm show chart "$CHART_DIR" | awk -F': *' '/^version:/ {print $2; exit}' | tr -d '"' | tr -d "'")"
          if [ -n "$CHART_VERSION_OVERRIDE" ]; then
            version="$CHART_VERSION_OVERRIDE"
          fi
          echo "chart_name=$name" >> "$GITHUB_OUTPUT"
          echo "chart_version=$version" >> "$GITHUB_OUTPUT"

      - name: Lint chart
        if: inputs.lint
        env:
          CHART_DIR: ${{ inputs.chart_dir }}
        run: helm lint "$CHART_DIR"

      - name: Warn on unsupported sign flag
        if: inputs.sign
        run: |
          echo "::warning::sign=true is reserved for future cosign integration; skipping."

      - name: Package chart
        env:
          CHART_DIR: ${{ inputs.chart_dir }}
          CHART_VERSION_OVERRIDE: ${{ inputs.chart_version }}
          APP_VERSION_OVERRIDE: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$CHART_VERSION_OVERRIDE" ]; then
            args+=(--version "$CHART_VERSION_OVERRIDE")
          fi
          if [ -n "$APP_VERSION_OVERRIDE" ]; then
            args+=(--app-version "$APP_VERSION_OVERRIDE")
          fi
          helm package "$CHART_DIR" --destination "$RUNNER_TEMP" "${args[@]}"

      - name: Log in to OCI registry
        env:
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USERNAME: ${{ secrets.registry_username || github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.registry_password || github.token }}
        run: |
          set -euo pipefail
          host="${REGISTRY#oci://}"
          host="${host%%/*}"
          echo "$REGISTRY_PASSWORD" | helm registry login "$host" --username "$REGISTRY_USERNAME" --password-stdin

      - name: Push chart
        id: publish
        env:
          CHART_NAME: ${{ steps.meta.outputs.chart_name }}
          CHART_VERSION: ${{ steps.meta.outputs.chart_version }}
          REGISTRY: ${{ inputs.registry }}
        run: |
          set -euo pipefail
          tgz="$RUNNER_TEMP/${CHART_NAME}-${CHART_VERSION}.tgz"
          if [ ! -f "$tgz" ]; then
            echo "::error::Packaged chart not found at $tgz"
            exit 1
          fi
          helm push "$tgz" "$REGISTRY"
          host="${REGISTRY#oci://}"
          echo "chart_ref=${host}/${CHART_NAME}:${CHART_VERSION}" >> "$GITHUB_OUTPUT"
