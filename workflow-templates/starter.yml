# NB: GHCR rejects mixed-case image paths. If your owner or repo
# name has any uppercase, replace ${{ github.repository }} below
# with a hardcoded lowercase value. GHA expressions have no
# tolower() function.
name: Build & Push Container Image (GHCR)

on:
  push:
    branches: [$default-branch]
    tags: ['v*.*.*']
  pull_request:
    branches: [$default-branch]

jobs:
  image:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: NoobCoder1209/github-actions-templates/.github/workflows/_docker-buildx.yml@v0.1.0
    with:
      image: ${{ github.repository }}
      platforms: linux/amd64,linux/arm64
      context: .
      dockerfile: Dockerfile
      push: ${{ github.event_name != 'pull_request' }}
      provenance: true
